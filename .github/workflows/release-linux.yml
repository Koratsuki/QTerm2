name: Build and Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libssl-dev pkg-config \
            wget file libfuse2 fuse dpkg-dev rpm \
            libsqlite3-dev libsecret-1-dev zsh \
            libgl1-mesa-dev libglu1-mesa-dev desktop-file-utils \
            debhelper devscripts

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DQTERM2_WARNINGS_AS_ERRORS=ON
          cmake --build build -j$(nproc)

      # Never publish an unverified binary: the release tag must pass the same
      # suite the pull-request CI runs.
      - name: Test
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen ctest --test-dir build \
            --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          cat ctest.log
          if [ "$rc" -ne 0 ]; then
            # Surface the failing assertion through check-run annotations so it
            # is diagnosable without downloading the raw job log.
            grep -E '(FAIL|Failed|FAILED|error|Error|expected:|actual:)' ctest.log | \
              head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$rc"
          fi

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/QTerm2 AppDir/usr/bin/
          cp packaging/QTerm2.desktop AppDir/usr/share/applications/
          cp packaging/QTerm2.svg AppDir/usr/share/icons/hicolor/scalable/apps/QTerm2.svg
          cp packaging/QTerm2.svg AppDir/QTerm2.svg
          ln -sf usr/share/applications/QTerm2.desktop AppDir/QTerm2.desktop
          ln -sf usr/share/icons/hicolor/scalable/apps/QTerm2.svg AppDir/.DirIcon
          cp packaging/AppImage/AppRun AppDir/
          chmod +x AppDir/AppRun

          # The AppImage must not require Qt installed on the host.  Bundle the
          # shared libraries of the binary and of the Qt libs it pulls in, plus
          # the Qt plugins (platforms, sqldrivers, imageformats, iconengines).
          mkdir -p AppDir/usr/lib AppDir/usr/plugins
          ldd build/QTerm2 | awk '/=> \// { print $3 }' | while read -r lib; do
            cp -L "$lib" AppDir/usr/lib/
          done
          for lib in AppDir/usr/lib/libQt6*.so*; do
            [ -e "$lib" ] || continue
            ldd "$lib" | awk '/=> \// { print $3 }' | while read -r dep; do
              cp -L "$dep" AppDir/usr/lib/ 2>/dev/null || true
            done
          done
          QT_PLUGINS_DIR=$(qmake6 -query QT_INSTALL_PLUGINS 2>/dev/null || true)
          if [ -z "$QT_PLUGINS_DIR" ] || [ ! -d "$QT_PLUGINS_DIR" ]; then
            echo "No se encontraron plugins Qt6: el AppImage dependería del sistema" >&2
            exit 1
          fi
          cp -r "$QT_PLUGINS_DIR"/* AppDir/usr/plugins/

          APPIMAGE_TOOL=appimagetool-x86_64.AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.0/$APPIMAGE_TOOL
          chmod +x $APPIMAGE_TOOL
          ./$APPIMAGE_TOOL --appimage-extract-and-run AppDir QTerm2-x86_64.AppImage --no-appstream

      - name: Build DEB/RPM
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          fi
          echo "Building packages for version ${VERSION}"
          cp -r packaging/debian .
          sed -i "s/qterm2 (.*)/qterm2 (${VERSION}-1)/" debian/changelog

          emit_log() {
            echo "::error::$1 failed (last 40 lines):"
            tail -40 "$1" | while IFS= read -r line; do echo "::error::$line"; done
          }

          if ! dpkg-buildpackage -us -uc -b > dpkg.log 2>&1; then
            cat dpkg.log
            emit_log dpkg.log
            exit 1
          fi
          tail -10 dpkg.log
          mv ../*.deb .

          mkdir -p ~/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          # Only tracked sources: never ship build/ AppDir/ or generated artefacts.
          git archive --format=tar.gz -o ~/rpmbuild/SOURCES/qterm2-${VERSION}.tar.gz HEAD
          # git archive carries no compiled binary: hand it to rpmbuild as Source1.
          cp build/QTerm2 ~/rpmbuild/SOURCES/QTerm2
          sed -e "s/^Version:.*/Version:        ${VERSION}/" \
              -e "s/^Source0:.*/Source0:        qterm2-${VERSION}.tar.gz/" \
              packaging/rpm/qterm2.spec > ~/rpmbuild/SPECS/qterm2.spec
          # --nodeps is needed on Ubuntu (no rpm build dependencies available);
          # runtime requirements are declared in the spec's Requires: fields.
          if ! rpmbuild -bb --nodeps ~/rpmbuild/SPECS/qterm2.spec > rpm.log 2>&1; then
            cat rpm.log
            emit_log rpm.log
            exit 1
          fi
          tail -10 rpm.log
          mv ~/rpmbuild/RPMS/*/*.rpm .

      - name: Cleanup appimagetool
        run: rm -f appimagetool-x86_64.AppImage

      - name: Upload Linux Artifacts & Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QTerm2-x86_64.AppImage
            *.deb
            *.rpm
          draft: false
          prerelease: false
