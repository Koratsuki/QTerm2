name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build
          
      - name: Deploy Qt
        shell: cmd
        run: |
          set PATH=%QT_ROOT%\bin;%PATH%
          windeployqt.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw build\QTerm2.exe
          
      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build\QTerm2.exe staging\
          if (Test-Path build\*.dll) { Copy-Item build\*.dll staging\ -Force }
          if (Test-Path build\iconengines) { Copy-Item build\iconengines staging\iconengines -Recurse -Force }
          if (Test-Path build\imageformats) { Copy-Item build\imageformats staging\imageformats -Recurse -Force }
          if (Test-Path build\platforms) { Copy-Item build\platforms staging\platforms -Recurse -Force }
          if (Test-Path build\styles) { Copy-Item build\styles staging\styles -Recurse -Force }
          if (Test-Path build\translations) { Copy-Item build\translations staging\translations -Recurse -Force }
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          $zipName = "QTerm2-Windows-${tag}_x64.zip"
          Compress-Archive -Path staging\* -DestinationPath $zipName -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows ZIP & Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
