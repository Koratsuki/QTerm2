name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build
          
      - name: Deploy Qt
        shell: cmd
        run: |
          set PATH=%QT_ROOT%\bin;%PATH%
          windeployqt.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw build\QTerm2.exe
          
      - name: Create ZIP
        shell: cmd
        run: |
          mkdir staging
          copy /y build\QTerm2.exe staging\
          xcopy /y /q build\*.dll staging\
          xcopy /E /I /y build\iconengines staging\iconengines 2>nul || exit 0
          xcopy /E /I /y build\imageformats staging\imageformats 2>nul || exit 0
          xcopy /E /I /y build\platforms staging\platforms 2>nul || exit 0
          xcopy /E /I /y build\styles staging\styles 2>nul || exit 0
          Compress-Archive -Path staging\* -DestinationPath QTerm2-Windows-x64.zip
          
      - name: Upload Windows ZIP & Release
        uses: softprops/action-gh-release@v1
        with:
          files: QTerm2-Windows-x64.zip
          draft: false
          prerelease: false
