name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'packaging/**'
      - '.github/workflows/release-*.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'packaging/**'
      - '.github/workflows/release-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenSSL (encrypted sync)
            disable_openssl: 'OFF'
          - name: No OpenSSL (graceful degradation)
            disable_openssl: 'ON'

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev libqt6sql6-sqlite qt6-tools-dev-tools \
            libssl-dev libsecret-1-dev zsh openssh-client

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQTERM2_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=${{ matrix.disable_openssl }}

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # archtest::testCryptoAvailability asserts the degraded behaviour
      # explicitly: with OpenSSL disabled, encrypt() must fail loudly.
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error
