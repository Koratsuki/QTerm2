name: Build and Release QTerm2

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libssl-dev pkg-config \
            wget file libfuse2 fuse dpkg-dev rpm \
            libsqlite3-dev libssh2-1-dev \
            libgl1-mesa-dev libglu1-mesa-dev desktop-file-utils \
            debhelper devscripts
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build -j$(nproc)
          
      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/QTerm2 AppDir/usr/bin/
          cp packaging/QTerm2.desktop AppDir/usr/share/applications/
          cp packaging/QTerm2.svg AppDir/usr/share/icons/hicolor/scalable/apps/QTerm2.svg
          cp packaging/QTerm2.svg AppDir/QTerm2.svg
          ln -sf usr/share/applications/QTerm2.desktop AppDir/QTerm2.desktop
          ln -sf usr/share/icons/hicolor/scalable/apps/QTerm2.svg AppDir/.DirIcon
          cp packaging/AppImage/AppRun AppDir/
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir QTerm2-x86_64.AppImage --no-appstream
          
      - name: Build DEB/RPM
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/v//')
          # Prepare DEB
          cp -r packaging/debian .
          sed -i "s/qterm2 (.*)/qterm2 (${VERSION}-1)/" debian/changelog
          sed -i 's/debhelper-compat (= 13)/debhelper-compat (= 12)/' debian/control || true
          rm -rf build # Clear for DEB
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .
          # RPM
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/qterm2-${VERSION}.tar.gz --exclude=.git .
          sed "s/Version:.*/Version:        ${VERSION}/" packaging/rpm/qterm2.spec > ~/rpmbuild/SPECS/qterm2.spec
          sed -i "s/Source0:.*/Source0:        qterm2-${VERSION}.tar.gz/" ~/rpmbuild/SPECS/qterm2.spec
          # Use --nodeps because we are on Ubuntu and don't have RPM-named dev packages
          rpmbuild -bb --nodeps ~/rpmbuild/SPECS/qterm2.spec
          mv ~/rpmbuild/RPMS/*/*.rpm .
          
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QTerm2-Linux
          path: |
            *.AppImage
            *.deb
            *.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          
      - name: Deploy Qt
        run: |
          # The install-qt-action sets QT_ROOT
          $QT_BIN = "${env:QT_ROOT}\bin"
          & "$QT_BIN\windeployqt.exe" build\Release\QTerm2.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw
          
      - name: Create ZIP
        run: |
          Compress-Archive -Path build\Release\* -DestinationPath QTerm2-Windows-x64.zip
          
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QTerm2-Windows
          path: QTerm2-Windows-x64.zip
          
  release:
    needs: [build-linux, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            QTerm2-Linux/*.AppImage
            QTerm2-Linux/*.deb
            QTerm2-Linux/*.rpm
            QTerm2-Windows/*.zip
          draft: false
          prerelease: false
