name: Build and Release QTerm2

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libxkbcommon-dev libssl-dev pkg-config \
            wget file libfuse2 fuse dpkg-dev rpm
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build -j$(nproc)
          
      - name: Package
        run: |
          # AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/QTerm2 AppDir/usr/bin/
          cp packaging/QTerm2.desktop AppDir/usr/share/applications/
          cp packaging/QTerm2.svg AppDir/usr/share/icons/hicolor/scalable/apps/QTerm2.svg
          ln -sf usr/share/applications/QTerm2.desktop AppDir/QTerm2.desktop
          ln -sf usr/share/icons/hicolor/scalable/apps/QTerm2.svg AppDir/.DirIcon
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage || ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          
          # DEB
          dpkg-buildpackage -us -uc -b
          
          # Prepare artifacts
          mkdir -p artifacts
          mv *.AppImage artifacts/
          mv ../*.deb artifacts/ || mv *.deb artifacts/
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QTerm2-Linux
          path: artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          
      - name: Deploy Qt
        run: |
          cd build\Release
          windeployqt.exe QTerm2.exe --release --no-translations --no-system-d3d-compiler --no-opengl-sw
          
      - name: Create ZIP
        run: |
          Compress-Archive -Path build\Release\* -DestinationPath QTerm2-Windows-x64.zip
          
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: QTerm2-Windows
          path: QTerm2-Windows-x64.zip
          
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            QTerm2-Linux/*
            QTerm2-Windows/*.zip
          draft: false
          prerelease: false
